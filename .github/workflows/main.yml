name: Postman API Tests

on:
  workflow_dispatch:
jobs:
  postman-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Postman environment
        run: |
          python -c "import json; data=json.load(open('TestEnvironment.postman_environment.json')); items=data.get('values', []); base=next((x.get('value','') for x in items if (x.get('key') or x.get('name')) == 'baseUrl'), ''); print('Environment name:', data.get('name')); print('baseUrl found:', bool(base)); print('baseUrl starts with https:', base.startswith('https://'))"
                    
      - name: Run Postman API Tests
        uses: postmanlabs/postman-cli-action@v1
        with:
          api-key: ${{ secrets.POSTMAN_API_KEY }}
          command: 'collection run MyApiTests.postman_collection.json --environment TestEnvironment.postman_environment.json'
